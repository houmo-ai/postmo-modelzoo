model: {
  framework: onnx,
  name: ultimateDO,
  save_dir: ./output,
  weight: ultimateDO_fp16_fuse.onnx,
  inputs: [
    {
      name: img,
      shape: [6, 3, 256, 704],
      layout: NCHW,
      format: RGB,
      image: {
        format: YUV422,
        size: ,
        crop: ,
      },
      dtype: uint8,
      mean: [ 0.485, 0.456, 0.406 ],
      std: [ 0.229, 0.224, 0.225 ],
      data_path: ../../data/datasets/imagenet/ILSVRC2012_val_00000016.JPEG,  # 用于比较各阶段输出的相似度，空表示采用随机数，默认随机数，可缺省
    }
  ],
  impl_class: Resnet50,
}

quant: {
  # ptq_cfg_path: ./compile_model/quant_config.py,
  calib_dir: ,
  calib_num: 20,
  debug_level: 1,
  calib_method: ,
}

build: {
  target: H30,
  opt_level: 0,
}

demo: {
  data_dir: ../../data/datasets/imagenet,
  test_num: 10,
}

perf: {
  data_dir: ,
  test_num: 1000,
  mode: throughput,
  end2end: ,
}

eval: {
  data_dir: ../../data/datasets/imagenet,
  test_num: 1,
  dataset_class: Dataset,
}

