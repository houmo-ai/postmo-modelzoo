model:
  name: yolov5m_face_clip
  save_dir: output
  model_path: yolov5m-face_clip.onnx
  inputs:
    input:
      shape: [1, 3, 640, 640]  # NCHW
      data_format: RGB
      mean: [0.0, 0.0, 0.0]
      std: [255.0, 255.0, 255.0]
      resize_type: 1
      padding_mode: 1
      padding_values: [114, 114, 114]
      resizer:
        toYUV_format: YUV420SP
        max_input_size: [1080, 1920]  # HW

quant:
  calib_data: coco2017/val2017
  calib_num: 50

build:
  ncore: 1
  opt_level: 2
