# model list
models: {
  # location: [str] the config file path
  # batch: [int] batch size
  # core_num: [int] core number of each module infer
  # quant: [bool] if need quant process, default:True
  # eval: [bool] if need eval process, default:True
  # onnx: [bool] if need eval process via onnx runtime, default:True
  resnet50: {location: models/backbone/resnet50, batch: 1, core_num: 1},
  mobilenetv2: {location: models/backbone/mobilenetv2, batch: 1, core_num: 1},
  efficientnet: {location: models/backbone/efficientnet, batch: 1, core_num: 1},
  # vit: {location: models/backbone/vit, batch: 1, core_num: 1, quant: False, eval: False, onnx: False},
  yolov5s: {location: models/detection/yolov5s, batch: 1, core_num: 1},
  yolov3: {location: models/detection/yolov3, batch: 1, core_num: 1},
  yolop: {location: models/autodrive/yolop, batch: 1, core_num: 1, eval: False, onnx: False},
}
