model: {
  framework: onnx,
  name: yolop,
  save_dir: ./output,
  weight: ./yolop.onnx,
  inputs: [
    {
      name: images,
      shape: [1, 3, 384, 640],
      layout: NCHW,
      format: RGB,
      src_format: YUV422,
      resize: ,
      crop: ,
      dtype: uint8,
      mean: [ 0.485, 0.456, 0.406 ],
      std: [ 0.229, 0.224, 0.225 ],
      data_path: ../../data/pic/lane.jpg,
    }
  ],
  impl_class: YoloP,
}

quant: {
  ptq_cfg_path: ,
  calib_dir:
  {
    images: ../../data/datasets/bdd100k/images/100k/val,
  },
  calib_num: 30,
  preproc_module: ,
  preproc_class: ,
  debug_level: 1,
  calib_method: ,
  skip_layer_idxes: [ ],
  skip_layer_types: [ ],
  skip_layer_names: [ ],
}

build: {
  target: H30,
  mode: AOT,
  opt_level: 0,
}

demo: {
  data_dir: ../../data/datasets/bdd100k/images/100k/val,
  test_num: 10,
}

perf: {
  data_dir: ,
  test_num: 1000,
  mode: throughput,
  end2end: ,
}

accuracy: {
  data_dir: ../../data/datasets/bdd100k/images/100k/val,
  test_num: 1,
  dataset_class: Dataset,
}

