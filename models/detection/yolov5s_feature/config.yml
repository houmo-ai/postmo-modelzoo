model:
  name: yolov5s_clip
  save_dir: output
  model_path: yolov5s_640x640_clip.onnx
  inputs:
    images:
      shape: [1, 3, 640, 640]
      data_format: RGB
      mean: [0.0, 0.0, 0.0]
      std: [255.0, 255.0, 255.0]
      resize_type: 1
      padding_mode: 1
      padding_values: [114, 114, 114]
  model_impl_module: model_impl
  model_impl_cls: YoloV5Clip
  
quant:
  calib_data: coco2017/val2017
  calib_num: 50

build:
  ncore: 1
  opt_level: 2


demo:
  data_dir: coco2017/val2017
  num: 10

eval:
  data_dir: coco2017
  num: 0
  dataset_module: dataset
  dataset_cls: Dataset
