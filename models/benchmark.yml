# model list
models:
  # location: [str] the config file path
  # config: [str] the model config file path, default: config.yml
  # exec_cfgs: [{batch_num: 1, core_num: 1, thread_num: 1, enable_eval: true}, ...] the model execution configs
  # batch_num: [int] run batch num, default: 1
  # core_num: [int] run core num, default: 1
  # thread_num: [int] run thread num, default: 1
  # enable_eval: [bool] whether to enable eval, default: false
  resnet50: 
    location: backbone/resnet50
    exec_cfgs: 
      - {batch_num: 1, core_num: 1, thread_num: 1, enable_eval: true}
      - {batch_num: 1, core_num: 1, thread_num: 4}
      - {batch_num: 1, core_num: 2, thread_num: 1}
      - {batch_num: 1, core_num: 4, thread_num: 1}
