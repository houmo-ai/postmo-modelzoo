version: 2
save_dir: output/26b-a4b-mtp

model:
  model_name: gemma4
  model_size: 26b-a4b
  model_dir: ./models/gemma-4-26B-A4B-it
  modelscope_repo: ["google/gemma-4-26B-A4B-it", "google/gemma-4-26B-A4B-it-assistant"]

quant:
  method: gptq
  attention: default
  speculative_decode: mtp
  speculative_model:
    draft_model_dir: ./models/gemma-4-26B-A4B-it-assistant
    target_model_dir: ./models/gemma-4-26B-A4B-it

build:
  flash_attention: 2
  ndevice: 1
  enable_common_subgraph: false
  prefill_chunk_length: 320
  context_length: 262144
  cpp_backend: v1
  components:
    visual:
      enable_common_subgraph: true
    mtp_draft_decode:
      context_length: null
    video_visual:
      enable_build: false  