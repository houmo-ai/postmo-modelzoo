version: 2
save_dir: output/e2b

model:
  model_name: gemma4
  model_size: e2b
  model_dir: ./models/gemma-4-E2B-it
  modelscope_repo: ["google/gemma-4-E2B-it"]

quant:
  method: autoround

build:
  flash_attention: 2
  ndevice: 1
  enable_common_subgraph: false
  prefill_chunk_length: 320
  context_length: 131072
  components:
    visual:
      enable_common_subgraph: true
    audio:
      enable_common_subgraph: true
    video_visual:
      enable_build: false