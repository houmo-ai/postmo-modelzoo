model:
  name: resnet50
  save_dir: output
  model_path: resnet50.onnx
  inputs:
    input.1:
      shape: [1, 3, 224, 224]  # NCHW
      data_format: RGB
      mean: [123.675, 116.28, 103.53]
      std: [58.395, 57.12, 57.375]
      resize_type: 0
      resizer:
        toYUV_format: YUV420SP
  model_impl_module: model_impl
  model_impl_cls: ResNet50

quant:
  calib_data: ./imagenet/ILSVRC2012_img_val
  calib_num: 32

build:
  ncore: 1
  opt_level: 2

demo:
  data_dir: ./imagenet/ILSVRC2012_img_val
  num: 10

eval:
  data_dir: ./imagenet
  num: 0
  dataset_module: dataset
  dataset_cls: Dataset
