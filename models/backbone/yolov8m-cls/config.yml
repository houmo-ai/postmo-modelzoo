model:
  name: yolov8m-cls
  save_dir: output
  model_path: yolov8m-cls.onnx
  inputs:
    images:
      shape: [1, 3, 224, 224]  # NCHW
      data_format: RGB
      mean: [0.0, 0.0, 0.0]
      std: [255.0, 255.0, 255.0]
      resize_type: 0
      resizer:
        toYUV_format: YUV420SP
  model_impl_module: model_impl
  model_impl_cls: YoloV8Cls

quant:
  calib_data: ./imagenet/ILSVRC2012_img_val
  calib_num: 32

build:
  ncore: 1
  opt_level: 2

demo:
  data_dir: ./imagenet/ILSVRC2012_img_val
  num: 10

eval:
  data_dir: ./imagenet
  num: 0
  dataset_module: dataset
  dataset_cls: Dataset
