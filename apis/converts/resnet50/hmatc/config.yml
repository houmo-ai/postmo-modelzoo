model:
  name: resnet50
  save_dir: output
  model_path: ../../models/resnet50.onnx
  inputs:
    input.1:
      shape: [1, 3, 224, 224] # NCHW
      data_format: RGB
      mean: [123.675, 116.28, 103.53]
      std: [58.395, 57.12, 57.375]
      resize_type: 0

quant:
  calib_data: ./imagenet/ILSVRC2012_img_val
  calib_num: 32
  config:
    mix_search:
      activation:
        method:
          name: auto
          target_cos: 0.98
        calib_samples: 8

build:
  ncore: 1
  opt_level: 2

